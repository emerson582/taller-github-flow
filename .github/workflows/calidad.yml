name: Calidad de Codigo

on:
  pull_request:
    branches: [main]

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Flake8
        run: pip install flake8

      - name: Verificar complejidad ciclomatica
        run: flake8 pagos.py --max-complexity=5 --show-source